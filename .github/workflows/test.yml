name: BRO AI checks

on:
  push:
    branches: ["main", "bro-ai-v1.0-foundation"]
  pull_request:
    branches: ["main"]

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
