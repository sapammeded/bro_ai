name: BRO AI checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: bro-ai-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test suite
        run: npm test
      - name: Run real Chromium DOM and XSS tests
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
          node tests/frontend-browser.test.cjs
      - name: Validate Cloudflare Worker bundle and Wrangler configuration
        run: npx --yes wrangler@4.156.0 deploy --dry-run
