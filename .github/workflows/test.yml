name: BRO AI checks

on:
  push:
    branches: ["main", "bro-ai-v1.0-foundation"]

permissions:
  contents: read

concurrency:
  group: bro-ai-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test suite
        run: npm test
      - name: Validate Cloudflare Worker bundle and Wrangler configuration
        run: npx --yes wrangler@4.36.0 deploy --dry-run
