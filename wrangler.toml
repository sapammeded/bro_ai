name = "bro-ai"
main = "./worker.js"
compatibility_date = "2026-10-12"
workers_dev = true

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
OPENROUTER_MODEL = "openrouter/free"
GROQ_MODEL = "openai/gpt-oss-20b"
OPENAI_MODEL = "gpt-4o-mini"
ANTHROPIC_MODEL = "claude-3-5-haiku-latest"
DEEPSEEK_MODEL = "deepseek-chat"
BRO_ALLOW_PAID = "0"
GROQ_ENABLE = "0"
BRO_ALLOWED_ORIGIN = "https://sapammeded.github.io"

# Approximate per-location limiter: 20 chat requests per 60 seconds per access token.
# namespace_id must be a positive integer unique within your Cloudflare account.
[[ratelimits]]
name = "BRO_CHAT_LIMITER"
namespace_id = "2026103001"

[ratelimits.simple]
limit = 20
period = 60

# Cloudflare Builds runs `wrangler preview` for PR previews.
# Keep preview bindings separate from production resources.
[previews.vars]
GEMINI_MODEL = "gemini-3.8-flash"
OPENROUTER_MODEL = "openrouter/free"
GROQ_MODEL = "openai/gpt-oss-20b"
OPENAI_MODEL = "gpt-4o-mini"
ANTHROPIC_MODEL = "claude-3-5-haiku-latest"
DEEPSEEK_MODEL = "deepseek-chat"
BRO_ALLOW_PAID = "0"
GROQ_ENABLE = "0"
BRO_ALLOWED_ORIGIN = "https://sapammeded.github.io"

[[previews.ratelimits]]
name = "BRO_CHAT_LIMITER"
namespace_id = "2026103002"

[previews.ratelimits.simple]
limit = 20
period = 60
